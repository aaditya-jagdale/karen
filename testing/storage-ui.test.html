<!doctype html><html lang="en"><meta charset="utf-8"><title>Karen activity UI check</title><link rel="stylesheet" href="../extension/storage/storage.css"><body><main>
  <header class="page-header"><div><p class="eyebrow">KAREN / LOCAL ACTIVITY</p><h1>Visual review inbox</h1><p>Test</p></div><div class="actions"><button id="choose">Choose</button><button id="reconnect" hidden>Reconnect</button><button id="copy">Copy</button><button id="export">Export</button><button id="clear">Clear</button></div></header>
  <p id="status"></p><p id="error"></p><section id="list-view"><h2 id="count"></h2><div id="activity"></div></section><section id="detail-view" hidden><button id="back">Back</button><div id="detail"></div></section>
</main><pre id="result">WAITING</pre><script>
const canvas = document.createElement('canvas'); canvas.width = 20; canvas.height = 20; canvas.getContext('2d').fillRect(0, 0, 20, 20);
const image = { data_url: canvas.toDataURL('image/png'), mime_type: 'image/png' };
canvas.getContext('2d').fillStyle = 'red'; canvas.getContext('2d').fillRect(0, 0, 20, 20);
const snapshot = { data_url: canvas.toDataURL('image/png') };
let activity = [{ id: 'sent', type: 'annotation_sent', url: 'https://example.test/', page_title: 'Example page', created_at: new Date().toISOString(), comment: 'Make the button clearer', components: [{ selector: 'button.primary', tag: 'button', classes: ['primary'], bounds: { x: 0, y: 0, width: 20, height: 20 }, image }], device: {}, snapshot }];
window.chrome = { runtime: { sendMessage: async message => {
  if (message.action === 'getActivity') return { success: true, activity, activityStatus: {} };
  if (message.action === 'deleteActivity') { activity = activity.filter(item => item.id !== message.id); return { success: true }; }
  return { success: true };
} }, storage: { onChanged: { addListener() {} } } };
window.confirm = () => true;
window.scrollTo = () => {};
window.showDirectoryPicker = undefined;
</script><script src="../extension/background/file-storage.js"></script><script src="../extension/image-viewer.js"></script><script src="../extension/storage/storage.js"></script><script>
(async () => { try {
  const check = (value, label) => { if (!value) throw new Error(label); };
  for (let i = 0; i < 100 && !document.querySelector('.activity-tile'); i++) await new Promise(resolve => setTimeout(resolve, 10));
  check(document.querySelectorAll('.activity-tile').length === 1, 'tile list');
  check(document.querySelector('.tile-image').src.startsWith('data:image/png;'), 'tile image');
  document.querySelector('.tile-open').click();
  check(!document.getElementById('detail-view').hidden, 'detail opens');
  check(document.querySelector('.full-comment').textContent === 'Make the button clearer', 'comment detail');
  check(document.querySelectorAll('.detail-snapshot, .component-image').length === 2, 'associated images');
  check(document.querySelector('.tile-image').src === image.data_url, 'component is primary tile image');
  check(!document.querySelector('.page-context').open, 'page context starts collapsed');
  check(Boolean(document.querySelector('.component-gallery').compareDocumentPosition(document.querySelector('.page-context')) & Node.DOCUMENT_POSITION_FOLLOWING), 'components precede page snapshot');
  document.querySelector('.component-gallery .image-open').click();
  const viewer = document.querySelector('dialog');
  check(viewer.open, 'component viewer opens');
  const preview = viewer.querySelector('img');
  await preview.decode();
  await new Promise(resolve => setTimeout(resolve, 20));
  viewer.querySelector('[data-action="actual"]').click();
  check(preview.style.width === '20px', 'actual image size');
  viewer.querySelector('[data-action="in"]').click();
  check(preview.style.width === '25px', 'zoom in');
  viewer.querySelector('[data-action="out"]').click();
  check(preview.style.width === '20px', 'zoom out');
  for (let i = 0; i < 30; i++) viewer.querySelector('[data-action="in"]').click();
  check(viewer.querySelector('output').textContent === '800%', 'zoom upper bound');
  viewer.querySelector('[data-action="fit"]').click();
  check(preview.style.width === '20px', 'fit does not upscale small captures');
  viewer.querySelector('[data-action="close"]').click();
  await new Promise(resolve => setTimeout(resolve, 20));
  check(!document.querySelector('dialog'), 'viewer cleaned up');
  document.querySelector('.page-context').open = true;
  document.querySelector('.page-context .image-open').click();
  check(document.querySelector('dialog img').src === snapshot.data_url, 'page snapshot viewer');
  document.querySelector('dialog [data-action="close"]').click();
  document.getElementById('back').click();
  check(!document.getElementById('list-view').hidden, 'back to tiles');
  document.getElementById('result').textContent = 'PASS: component-first gallery, secondary snapshot, image viewers, zoom, fit, cleanup, back navigation';
} catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.stack; } })();
</script></body></html>
